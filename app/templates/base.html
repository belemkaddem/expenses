<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Dépenses{% endblock %}</title>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#1c1c1a; --muted:#6b6a65; --line:#e6e4de;
          --accent:#0f766e; --accent-soft:#ccebe7; --danger:#b42318; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--ink); }
  a { color:var(--accent); text-decoration:none; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px;
           padding:14px 20px; background:var(--card); border-bottom:1px solid var(--line); }
  header .brand { font-weight:700; letter-spacing:-.01em; }
  header nav { display:flex; gap:16px; font-size:14px; }
  @media (max-width:760px){ header{ flex-direction:column; align-items:flex-start; padding:12px 16px; }
    header nav{ flex-wrap:wrap; gap:6px 14px; } main{ padding:16px; } }
  main { max-width:1000px; margin:0 auto; padding:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; }
  .muted { color:var(--muted); }
  .num { font-variant-numeric:tabular-nums; }
  input, select, button { font:inherit; padding:9px 11px; border:1px solid var(--line);
                          border-radius:8px; background:#fff; color:var(--ink); }
  button, .btn { background:var(--accent); color:#fff; border-color:var(--accent); cursor:pointer;
                 border-radius:8px; padding:9px 14px; display:inline-block; }
  .btn-ghost { background:transparent; color:var(--muted); border:none; padding:4px 8px; cursor:pointer; }
  .btn-ghost:hover { color:var(--danger); }
</style>
{% block head %}{% endblock %}
</head>
<body>
{% if me %}
<header>
  <span class="brand">💸 Dépenses</span>
  <nav>
    <a href="/">Tableau de bord</a>
    <a href="/simulateur">Simulateur SMS</a>
    <a href="/export.csv">Export CSV</a>
    <a href="/logout" class="muted">{{ me.name }} · déconnexion</a>
  </nav>
</header>
{% endif %}
<main>{% block content %}{% endblock %}</main>
</body>
</html>
